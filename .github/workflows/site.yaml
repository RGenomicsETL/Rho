on:
  push:
    branches: [main]
  workflow_dispatch:

name: site.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://yihui.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: litedown, xfun
      - name: Stage project documentation
        run: |
          mkdir -p site/docs
          cp docs/*.md site/docs/
          touch -d 2000-01-01 site/docs/index.html
      - uses: yihui/actions/litedown-site@HEAD
        with:
          site-dir: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
